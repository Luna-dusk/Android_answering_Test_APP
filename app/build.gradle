plugins { id 'com.android.application' }
android {
    namespace 'cn.embedded.quiz'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.embedded.quiz'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // Reuse this machine's development key so Run can update the installed app.
    def developmentKey = rootProject.file('.build/development.keystore')
    if (developmentKey.exists()) {
        signingConfigs {
            debug {
                storeFile developmentKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes { release { minifyEnabled false } }
}
